# Opt-in disposable database for integration tests only. It is not a production service.
services:
  postgres:
    # Match the Supabase production major version. This remains an opt-in,
    # localhost-only, tmpfs-backed disposable test service.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stakemate_integration
      POSTGRES_USER: stakemate_test
      POSTGRES_PASSWORD: stakemate_test_only
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
    volumes:
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stakemate_test -d stakemate_integration"]
      interval: 2s
      timeout: 2s
      retries: 15
