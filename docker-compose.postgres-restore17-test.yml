# Disposable PostgreSQL 17 restore rehearsal only. It has no production credentials.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stakemate_restore17
      POSTGRES_USER: stakemate_restore17_test
      POSTGRES_PASSWORD: stakemate_restore17_test_only
    ports:
      - "127.0.0.1:55434:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stakemate_restore17_test -d stakemate_restore17"]
      interval: 2s
      timeout: 2s
      retries: 15
